<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vernacular onboarding agent</title>
<style>
  :root {
    --bg: #12100e; --panel: #1b1815; --line: #2f2a25;
    --text: #ece7e0; --dim: #8f867c; --accent: #d98a4f; --ok: #6f9f5c;
    --font: ui-sans-serif, system-ui, "Segoe UI", "Noto Sans Devanagari", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 13px; }
  #status { margin-left: auto; font-size: 12px; color: var(--dim); }
  #status.live::before { content: "● "; color: var(--ok); }
  #status.dead::before { content: "● "; color: var(--accent); }

  main { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } #side { display: none; } }

  #chat { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 62ch; line-height: 1.55; }
  .msg .who { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
  .msg.you { align-self: flex-end; text-align: right; }
  .msg.you .body { background: #2a2420; padding: 9px 13px; border-radius: 12px 12px 2px 12px; display: inline-block; }
  .msg.agent .body { background: var(--panel); padding: 9px 13px; border-radius: 12px 12px 12px 2px; display: inline-block; border: 1px solid var(--line); }
  .msg.note { color: var(--dim); font-size: 12px; font-style: italic; align-self: center; }
  .meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .meta .moved { color: var(--ok); }
  .meta .stuck { color: var(--accent); }

  #side { border-left: 1px solid var(--line); padding: 18px; overflow-y: auto; }
  #side h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; }
  #state { font-size: 14px; margin-bottom: 20px; word-break: break-word; }
  #trail { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--dim); }
  #trail li { padding: 3px 0; border-left: 2px solid var(--line); padding-left: 10px; }
  #trail li.now { color: var(--text); border-left-color: var(--accent); }

  footer { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 10px; }
  input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 11px 14px; border-radius: 8px; font: inherit; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); border: 0; color: #1a1410; font: inherit; font-weight: 600;
    padding: 0 20px; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.listening { background: #b3261e; color: #fff; border-color: #b3261e; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  button.listening { animation: pulse 1.1s ease-in-out infinite; }
  label.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; opacity: .8; }
  #meter { width: 90px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  #level { height: 100%; width: 0%; background: #9aa0a6; transition: width .05s linear; }
  #meter.voice #level { background: #b3261e; }
</style>
</head>
<body>

<header>
  <h1>Vernacular onboarding agent</h1>
  <span class="sub">speak any Indian language &middot; the state machine decides, the model only phrases</span>
  <span id="status">connecting</span>
</header>

<main>
  <div id="chat"></div>
  <aside id="side">
    <h2>Current state</h2>
    <div id="state">&mdash;</div>
    <h2>Path taken</h2>
    <ol id="trail"></ol>
  </aside>
</main>

<footer>
  <input id="input" placeholder="Type what a caller would say…" autocomplete="off" maxlength="500" disabled>
  <button id="send" disabled>Send</button>
  <button id="mic" disabled title="Hold a conversation out loud">&#127908; Speak</button>
  <label class="toggle"><input type="checkbox" id="tts" checked> speak replies</label>
  <label class="toggle"><input type="checkbox" id="handsfree"> hands-free</label>
  <div id="meter" title="microphone level; red means speech detected"><div id="level"></div></div>
  <button id="retry" hidden>Reconnect</button>
</footer>

<script>
const chat = document.getElementById("chat");
const trail = document.getElementById("trail");
const stateEl = document.getElementById("state");
const statusEl = document.getElementById("status");
const input = document.getElementById("input");
const send = document.getElementById("send");
const retry = document.getElementById("retry");
const mic = document.getElementById("mic");
const tts = document.getElementById("tts");
const handsfree = document.getElementById("handsfree");
const meter = document.getElementById("meter");
const level = document.getElementById("level");

let socket = null;
let credentials = null;
let attempts = 0;
let needsNewSession = false;

// Six tries over roughly half a minute is long enough to ride out a restart
// and short enough that a genuinely dead server is reported rather than
// silently retried forever.
const MAX_ATTEMPTS = 6;
const MAX_BACKOFF_MS = 10000;

// ---------------------------------------------------------------------------
// Speech, in the browser.
//
// The server never receives audio. The recogniser runs here, and what crosses
// the socket is text plus how sure the recogniser was -- which is the one
// thing a text-only channel throws away. Speech recognition does not fail
// loudly: it returns a plausible sentence with no error, so "nahi" heard as
// "haan" at the consent gate would look exactly like a consent. The number is
// the only warning anyone gets, so it travels with the words.
//
// Free, no API key, and nothing to install. The trade is that it is Chrome,
// Edge and Safari only, quality on Indic speech is whatever the browser
// vendor's model manages, and the audio goes to their servers -- which is
// fine for a demo and not something a bank could ship.
// ---------------------------------------------------------------------------
const Recogniser = window.SpeechRecognition || window.webkitSpeechRecognition;
const canListen = Boolean(Recogniser);
const canSpeak = "speechSynthesis" in window;

let recognition = null;
let listening = false;
let player = null;   // the <audio> playing a server-synthesised reply
let heardSoFar = "";
let bestConfidence = null;
// The machine chooses the language and tells us. The browser never guesses it:
// re-detecting per utterance would let one mumbled sentence switch somebody
// into a language they cannot read.
let language = "en-IN";

function voiceFor(code) {
  const voices = window.speechSynthesis.getVoices() || [];
  return voices.find(v => v.lang === code)
      || voices.find(v => v.lang && v.lang.replace("_", "-") === code)
      || voices.find(v => v.lang && v.lang.split(/[-_]/)[0] === code.split("-")[0])
      || null;
}

// A reply synthesised server-side, by a vendor with actual Indic voices.
// Preferred over speechSynthesis whenever it arrives, because the browser
// cannot do this at all: Windows ships no Indic voices, so the local path
// reads Devanagari in an English one.
//
// Returns false if it could not play, and the caller then falls back. A
// failure here must never leave the agent silent -- someone halfway through
// opening a bank account is owed a reply even if it is in the wrong voice.
function playFromServer(base64Wav) {
  if (!tts.checked) return true;          // muted on purpose, not a failure
  try {
    const bytes = Uint8Array.from(atob(base64Wav), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));

    stopSpeaking();
    player = new Audio(url);
    player.onended = () => URL.revokeObjectURL(url);
    // Autoplay policies can refuse until the page has been clicked once.
    // Falling back to the browser voice is better than silence.
    player.play().catch(() => note("Click anywhere once to allow audio."));
    return true;
  } catch (err) {
    return false;
  }
}

function stopSpeaking() {
  if (player) { player.pause(); player = null; }
  if (canSpeak) window.speechSynthesis.cancel();
}

function speak(text) {
  if (!canSpeak || !tts.checked || !text) return;
  // Never queue. If a new reply has arrived the previous one is stale, and a
  // backlog of sentences talking over each other is how voice demos die.
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = language;
  const voice = voiceFor(language);
  if (voice) utterance.voice = voice;
  else if (language !== "en-IN") {
    note(`No installed voice for ${language} — reading it in the default voice. `
       + `Start the server with SARVAM_TTS=1 for a real one.`);
  }
  window.speechSynthesis.speak(utterance);
}

function note(text) {
  bubble("note", text);
}

// ---------------------------------------------------------------------------
// Turn-taking.
//
// The detector lives here because this is where the microphone is. The
// POLICY -- how long a pause ends a turn -- arrives from the server with each
// reply, because it depends on the conversation's state and the page has no
// business deciding that. See app/flow/turn_taking.py.
//
// Two jobs:
//
//   endpointing  decide they have finished, and stop the recogniser. Chrome
//                will endpoint on its own, but on a fixed heuristic we cannot
//                tune. Running the recogniser in continuous mode and stopping
//                it ourselves is what makes a per-state window possible.
//   barge-in     if they start talking while the agent is talking, stop the
//                agent. A machine that finishes its sentence over somebody is
//                the support line everyone has met.
//
// Energy-based, with an ambient floor measured at the start of each turn
// rather than a constant. A constant threshold is wrong in both directions:
// deaf in a noisy room, hair-trigger in a quiet one, and this is meant for
// people who are not in offices.
//
// UNTUNED. These constants are reasonable, not measured -- verifying them
// needs a real microphone in a real room, which is what the level meter is
// for. Watch it while speaking: the bar should turn red only while you talk.
// ---------------------------------------------------------------------------
// MEASURED, not guessed. Real Hindi speech through this exact RMS maths
// (scripts/measure_vad.py over the corpus clips) sits at about 0.26, with
// between-word quiet four orders of magnitude below it. Every number here is
// derived from that, and the script re-derives them if the corpus changes.
const SPEECH_RMS = 0.26;       // measured median across 8 clips

const CALIBRATION_MS = 400;    // how long to listen to the room first
const ENTER_MARGIN = 3.5;      // times the floor to START counting speech
const EXIT_MARGIN = 2.0;       // ...and to stop. Hysteresis; see below.
const MIN_THRESHOLD = 0.006;   // ~2% of speech: a floor for very quiet rooms
const MAX_THRESHOLD = SPEECH_RMS / 3;  // never calibrate ourselves deaf
const MIN_SPEECH_MS = 200;     // shorter than this is a cough, not a turn
const TICK_MS = 50;            // see the note on requestAnimationFrame below

// Hysteresis, which matters more than the exact numbers. With one threshold,
// a signal hovering near it flickers voiced/unvoiced every frame and chops a
// sentence into fragments. Entering speech needs 3.5x the floor; staying in
// it only needs 2.0x. That is the difference between "is this speech" and
// "are they still talking", and they are not the same question.
function isVoiced(rms, floor, alreadySpeaking) {
  const threshold = floor * (alreadySpeaking ? EXIT_MARGIN : ENTER_MARGIN);
  return rms > threshold;
}

// Pulled out of the animation loop so it can be exercised with made-up
// numbers instead of a microphone. The loop measures; this decides, and the
// deciding is the part with the bugs in it.
//
//   sawSpeech        have they said anything at all this turn
//   speechStartedAt  when they began, for the too-short-to-count check
//   lastVoiceAt      the last frame above the threshold
//   silenceMs        the per-state window, from turn_taking.py
//
// Returns "listening", "endpoint" (they have finished) or "gave-up" (nobody
// ever started). Separate answers because they need separate replies: one
// sends a turn, the other says "I didn't catch anything".
function turnVerdict({ sawSpeech, speechStartedAt, lastVoiceAt, startedAt, now, silenceMs, patienceMs, minSpeechMs }) {
  // How long they actually spoke -- first voiced frame to LAST voiced frame.
  // Measuring to `now` instead was a real bug: a 100ms cough followed by eight
  // seconds of silence looked like eight seconds of speech, so the agent
  // answered a chair scrape. In the rooms this product is for, that is not an
  // edge case.
  const speechDuration = sawSpeech ? lastVoiceAt - speechStartedAt : 0;
  const enoughSpeech = speechDuration > minSpeechMs;
  const quietFor = sawSpeech ? now - lastVoiceAt : now - startedAt;

  if (enoughSpeech && quietFor > silenceMs) return "endpoint";

  // Checked whether or not a noise was heard. Nesting this under `else` was
  // the second half of the same bug: a cough set sawSpeech, and the detector
  // then had no way to ever give up.
  if (now - startedAt > patienceMs) return "gave-up";

  return "listening";
}

// Re-runnable, because there is no JS test runner in this project and the
// bug these caught was a real one: open the page with ?selftest=1 and read
// the console. Cheaper than adding a toolchain for one pure function, and
// honest about being a smaller promise than the Python suite.
const TURN_CASES = [
  ["nobody spoke, still patient",        { sawSpeech:false, now:5000 }, "listening"],
  ["nobody spoke, patience spent",       { sawSpeech:false, now:12500 }, "gave-up"],
  ["mid-sentence pause",                 { sawSpeech:true, speechStartedAt:1000, lastVoiceAt:4000, now:5200 }, "listening"],
  ["just under the CONSENT window",      { sawSpeech:true, speechStartedAt:1000, lastVoiceAt:4000, now:5790 }, "listening"],
  ["past the CONSENT window",            { sawSpeech:true, speechStartedAt:1000, lastVoiceAt:4000, now:5900 }, "endpoint"],
  ["that pause ends LANGUAGE_SELECT",    { silenceMs:800, sawSpeech:true, speechStartedAt:1000, lastVoiceAt:4000, now:4900 }, "endpoint"],
  ["...but not CONSENT",                 { sawSpeech:true, speechStartedAt:1000, lastVoiceAt:4000, now:4900 }, "listening"],
  ["a cough is not a turn",              { sawSpeech:true, speechStartedAt:1000, lastVoiceAt:1100, now:9000 }, "listening"],
  ["a cough eventually gives up",        { sawSpeech:true, speechStartedAt:1000, lastVoiceAt:1100, now:12500 }, "gave-up"],
  ["a short yes still counts",           { sawSpeech:true, speechStartedAt:1000, lastVoiceAt:1350, now:3200 }, "endpoint"],
];

// Hysteresis: it takes more energy to START hearing speech than to keep
// hearing it. With one threshold a signal hovering near it flickers every
// frame and chops a sentence into fragments.
const VOICED_CASES = [
  ["clear speech starts",        [0.26,  0.005, false], true],
  ["room tone does not",         [0.010, 0.005, false], false],
  ["a quiet tail keeps going",   [0.013, 0.005, true],  true],
  ["...but would not have started", [0.013, 0.005, false], false],
  ["true silence ends it",          [0.008, 0.005, true],  false],
];

function runTurnSelfTest() {
  const base = { startedAt: 0, minSpeechMs: 200, patienceMs: 12000, silenceMs: 1800 };
  let failed = 0;
  for (const [name, input, want] of TURN_CASES) {
    const got = turnVerdict({ ...base, ...input });
    if (got !== want) { failed++; console.error(`FAIL ${name}: wanted ${want}, got ${got}`); }
    else console.log(`ok   ${name}`);
  }
  for (const [name, [rms, floor, speaking], want] of VOICED_CASES) {
    const got = isVoiced(rms, floor, speaking);
    if (got !== want) { failed++; console.error(`FAIL ${name}: wanted ${want}, got ${got}`); }
    else console.log(`ok   ${name}`);
  }
  const total = TURN_CASES.length + VOICED_CASES.length;
  console.log(failed ? `${failed} FAILED` : `all ${total} passed`);
  return failed === 0;
}

if (new URLSearchParams(location.search).get("selftest") === "1") {
  setTimeout(runTurnSelfTest, 0);
}

let detector = null;
// What the microphone is actually doing. Readable from the console with
// micDiag(), because "it is listening but nothing happens" is not a
// debuggable report and this turns it into numbers.
let micState = null;
function micDiag() { return micState; }
window.micDiag = micDiag;
let turnPolicy = { silence_ms: 1000, patience_ms: 12000, barge_in: true, report_interruption: false };
let interruptedThisTurn = false;

function agentIsTalking() {
  return Boolean(player && !player.paused) ||
         (canSpeak && window.speechSynthesis.speaking);
}

async function startDetector({ onSpeechEnd, onGaveUp }) {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });

  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  // An AudioContext created after an `await` is outside the user-gesture that
  // started it, so Chrome may hand it back SUSPENDED -- and a suspended
  // context's analyser returns silence forever. The detector then never hears
  // anything, never endpoints, and the microphone sits lit while nothing
  // happens. That is exactly the bug this line fixes, and it is invisible
  // without asking: there is no error, just zeroes.
  if (ctx.state === "suspended") {
    try { await ctx.resume(); } catch (e) { /* reported below */ }
  }

  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  ctx.createMediaStreamSource(stream).connect(analyser);

  micState = {
    context: ctx.state,
    sampleRate: ctx.sampleRate,
    track: (stream.getAudioTracks()[0] || {}).label || "unknown",
    peakRms: 0,
    floor: null,
    framesSeen: 0,
    voicedFrames: 0,
  };
  if (ctx.state !== "running") {
    note("Audio context is " + ctx.state + " — the level meter will stay flat.");
  }

  const frame = new Float32Array(analyser.fftSize);
  const startedAt = performance.now();
  const ambient = [];

  let floor = MIN_THRESHOLD;
  let speechStartedAt = 0;
  let lastVoiceAt = 0;
  let sawSpeech = false;
  let raf = 0;

  function tick() {
    analyser.getFloatTimeDomainData(frame);
    let sum = 0;
    for (let i = 0; i < frame.length; i++) sum += frame[i] * frame[i];
    const rms = Math.sqrt(sum / frame.length);
    const now = performance.now();

    // Measure the room before judging anything in it.
    if (now - startedAt < CALIBRATION_MS) {
      ambient.push(rms);
      return;
    }
    if (ambient.length) {
      const sorted = [...ambient].sort((a, b) => a - b);
      // 20th percentile, not the median. If somebody is already talking when
      // the turn opens -- which happens constantly in hands-free, because
      // people answer before the agent has finished -- the median of that
      // window IS speech, and calibrating to it makes the detector deaf for
      // the rest of the turn. A low percentile still finds the gaps.
      floor = sorted[Math.floor(sorted.length * 0.2)] || 0;
      floor = Math.min(Math.max(floor, MIN_THRESHOLD), MAX_THRESHOLD);
      ambient.length = 0;
    }

    const voice = isVoiced(rms, floor, sawSpeech && (now - lastVoiceAt) < 300);

    if (micState) {
      micState.framesSeen++;
      micState.floor = floor;
      if (rms > micState.peakRms) micState.peakRms = rms;
      if (voice) micState.voicedFrames++;
    }
    level.style.width = Math.min(100, (rms / (floor * ENTER_MARGIN * 2)) * 100) + "%";
    meter.classList.toggle("voice", voice);

    if (voice) {
      if (!sawSpeech) {
        sawSpeech = true;
        speechStartedAt = now;
        // Barge-in. They started; the agent stops.
        if (agentIsTalking()) {
          interruptedThisTurn = true;
          stopSpeaking();
        }
      }
      lastVoiceAt = now;
    }

    const verdict = turnVerdict({
      sawSpeech, speechStartedAt, lastVoiceAt, startedAt, now,
      silenceMs: turnPolicy.silence_ms,
      patienceMs: turnPolicy.patience_ms,
      minSpeechMs: MIN_SPEECH_MS,
    });

    if (verdict === "endpoint") { stopDetector(); onSpeechEnd(); return; }
    if (verdict === "gave-up") { stopDetector(); onGaveUp(); return; }
  }

  // setInterval rather than requestAnimationFrame. rAF stops firing when the
  // tab is hidden, so switching tabs mid-sentence froze the detector and the
  // turn never ended. It also paces at the display's refresh rate, which is
  // not a sampling decision anyone made -- 50ms is a choice, 16.7ms was an
  // accident of the monitor.
  detector = {
    stop() {
      clearInterval(raf);
      stream.getTracks().forEach(t => t.stop());
      ctx.close().catch(() => {});
      level.style.width = "0%";
      meter.classList.remove("voice");
    },
  };
  raf = setInterval(tick, TICK_MS);
}

// The safety net described above. Cleared whenever the turn ends by any
// route, so it cannot fire into a finished turn.
let fallbackStop = null;

function armFallbackStop() {
  clearTimeout(fallbackStop);
  fallbackStop = setTimeout(() => {
    if (listening) { try { recognition.stop(); } catch (e) {} }
  }, turnPolicy.silence_ms + 400);   // a beat behind the VAD, so it defers
}

function stopDetector() {
  if (detector) { detector.stop(); detector = null; }
}

function startListening() {
  if (!canListen || listening) return;

  // Stop talking before listening, or the microphone hears the agent and
  // transcribes the agent's own sentence back to the server.
  stopSpeaking();

  recognition = new Recogniser();
  recognition.lang = language;
  // Continuous, and WE decide when it ends. Chrome endpoints on a heuristic
  // we cannot tune; a per-state window is the whole point of turn_taking.py.
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  heardSoFar = "";
  bestConfidence = null;
  interruptedThisTurn = false;

  startDetector({
    onSpeechEnd: () => { try { recognition.stop(); } catch (e) {} },
    onGaveUp: () => { try { recognition.stop(); } catch (e) {} },
  }).catch(err => {
    // No microphone, or permission refused. Fall back to Chrome's own
    // endpointing rather than leaving the button dead.
    note("Microphone unavailable for turn detection: " + err.name);
  });

  recognition.onstart = () => {
    listening = true;
    mic.classList.add("listening");
    mic.innerHTML = "&#9632; Listening…";
  };

  recognition.onend = () => {
    listening = false;
    clearTimeout(fallbackStop);
    stopDetector();
    mic.classList.remove("listening");
    mic.innerHTML = "&#127908; Speak";

    if (heardSoFar.trim()) {
      sendUtterance(heardSoFar, bestConfidence);
    } else {
      note("Didn't catch anything — say it again.");
      // Distinguish "you were quiet" from "the detector is deaf". Without
      // this they look identical from the outside, which is how a suspended
      // audio context stays hidden.
      if (micState && micState.framesSeen > 10 && micState.voicedFrames === 0) {
        note(
          `Microphone read ${micState.framesSeen} frames and heard no speech ` +
          `(peak ${micState.peakRms.toFixed(4)}, threshold ` +
          `${(micState.floor * ENTER_MARGIN).toFixed(4)}). ` +
          `Run micDiag() in the console.`
        );
      }
    }
  };

  recognition.onerror = (event) => {
    if (event.error === "no-speech") { note("Didn't hear anything."); return; }
    if (event.error === "not-allowed") {
      note("Microphone blocked. Allow it in the address bar to speak.");
      mic.disabled = true;
      return;
    }
    note("Microphone error: " + event.error);
  };

  // Accumulate finals; the turn is normally sent from onend, once OUR
  // detector has decided it is over.
  //
  // BUT the detector must not be the only thing that can end a turn. It was,
  // and a detector that heard nothing meant nothing was ever sent -- the mic
  // stayed lit while the recogniser was working perfectly and its words went
  // nowhere. One component failing should degrade the experience, not remove
  // it, which is the same rule the synthesis path already follows.
  //
  // So every final result arms a fallback stop. Whichever endpoint arrives
  // first wins; if the VAD is healthy it always will, because it is watching
  // the audio rather than waiting on a recogniser that has already decided.
  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (!result.isFinal) continue;
      const best = result[0];
      heardSoFar += (heardSoFar ? " " : "") + best.transcript;
      // Chrome reports 0 for some results rather than omitting the field. A
      // real zero and "not measured" are different things, and sending 0
      // would block every turn, so an absent or zero score travels as null.
      const raw = best.confidence;
      if (typeof raw === "number" && raw > 0) {
        bestConfidence = bestConfidence === null ? raw : Math.min(bestConfidence, raw);
      }
      armFallbackStop();
    }
  };

  recognition.start();
}

function bubble(who, text, meta) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + who;
  if (who !== "note") {
    const label = document.createElement("div");
    label.className = "who";
    label.textContent = who === "you" ? "caller" : "agent";
    wrap.appendChild(label);
  }
  const body = document.createElement("div");
  body.className = who === "note" ? "" : "body";
  body.textContent = text;
  wrap.appendChild(body);
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.innerHTML = meta;
    wrap.appendChild(m);
  }
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function recordState(state, moved) {
  stateEl.textContent = state;
  const previous = trail.lastElementChild;
  if (previous) previous.classList.remove("now");
  if (!previous || previous.dataset.state !== state) {
    const li = document.createElement("li");
    li.textContent = state;
    li.dataset.state = state;
    li.className = "now";
    trail.appendChild(li);
  } else {
    previous.classList.add("now");
  }
}

function setLive(live, label) {
  statusEl.className = live ? "live" : "dead";
  statusEl.textContent = label;
  input.disabled = !live;
  send.disabled = !live;
  mic.disabled = !live || !canListen;
  if (!live) stopSpeaking();
  if (live) input.focus();
}

async function start() {
  const created = await fetch("/api/session", { method: "POST" }).then(r => r.json());
  credentials = created;
  connect();
}

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const url = `${scheme}://${location.host}/ws`
    + `?session=${encodeURIComponent(credentials.session_id)}`
    + `&token=${encodeURIComponent(credentials.token)}`;

  socket = new WebSocket(url);

  socket.onopen = () => {
    attempts = 0;
    needsNewSession = false;
    retry.hidden = true;
    setLive(true, "connected");
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.error) { bubble("note", data.error); return; }

    const movement = data.moved
      ? `<span class="moved">moved</span> to ${data.state}`
      : `<span class="stuck">stayed</span> in ${data.state}`;
    const understood = data.understood ? "" : " &middot; not understood";
    // The machine decides the language; we follow it. It can change mid-call
    // when somebody asks to switch, and the voice has to follow with it.
    if (data.language) language = data.language;
    if (data.turn) turnPolicy = data.turn;
    const voice = data.audio ? " &middot; sarvam voice" : "";
    bubble("agent", data.text, movement + understood + voice);
    recordState(data.state, data.moved);

    // Server audio when it came, the browser's own voice when it did not.
    if (!(data.audio && playFromServer(data.audio))) speak(data.text);

    // Hands-free: listen again once the agent has stopped talking. Started
    // after the reply rather than during it, so the first thing the detector
    // measures is the room and not the agent's own voice.
    if (handsfree.checked && !data.finished && canListen) {
      waitForQuiet(() => { if (!listening) startListening(); });
    }

    if (data.finished) {
      setLive(false, "session finished");
      bubble("note", "This session is complete. Reload to start another.");
    }
  };

  socket.onclose = (event) => {
    if (event.code === 1008) {
      // The session this page holds no longer exists on the server. In
      // practice that almost always means the server restarted -- sessions
      // live in memory, so a restart drops every one of them. Reconnecting
      // cannot help; the only recovery is a new session, so offer that
      // rather than leaving the page stuck saying "not authorised".
      setLive(false, "session expired");
      bubble("note", "This session is no longer on the server, most likely because it restarted.");
      needsNewSession = true;
      retry.textContent = "Start a new session";
      retry.hidden = false;
      return;
    }

    setLive(false, "disconnected");

    // Reconnecting resumes the same session -- the server reloads it and
    // carries on from whatever state it is actually in. Same mechanism the
    // KYC handoff uses; a dropped socket is just a very short version of it.
    //
    // Backoff rather than a fixed interval: a server that is down stays down
    // for a while, and retrying every 1.5s forever hammers it through its
    // own recovery. Give up eventually and say so -- an application that
    // claims to be "reconnecting…" an hour later is lying to the user.
    if (attempts >= MAX_ATTEMPTS) {
      bubble("note", "Could not reconnect. The server may not be running.");
      retry.hidden = false;
      statusEl.textContent = "offline";
      return;
    }

    const wait = Math.min(1000 * Math.pow(2, attempts), MAX_BACKOFF_MS);
    attempts += 1;
    bubble("note", `Connection lost. Retrying in ${Math.round(wait / 1000)}s…`);
    setTimeout(connect, wait);
  };
}

function sendUtterance(text, confidence) {
  const trimmed = (text || "").trim();
  if (!trimmed || !socket || socket.readyState !== WebSocket.OPEN) return;

  const spoken = typeof confidence === "number";
  bubble("you", trimmed, spoken
    ? `heard &middot; confidence ${confidence.toFixed(2)}`
    : "typed");

  const message = { utterance: trimmed };
  // Omitted entirely when typed. Nobody mishears a keyboard, and the server
  // treats a missing field as certain rather than as zero.
  if (spoken) message.confidence = confidence;
  // Only reported where the server said it matters -- barge-in is normal, and
  // a row for every one of them is noise in the trail.
  if (interruptedThisTurn && turnPolicy.report_interruption) message.interrupted = true;
  interruptedThisTurn = false;
  socket.send(JSON.stringify(message));
  input.value = "";
}

function submit() {
  sendUtterance(input.value, null);
}

retry.addEventListener("click", () => {
  attempts = 0;
  retry.hidden = true;

  if (needsNewSession) {
    // A genuinely new application. Clear the transcript so the old one is
    // not mistaken for part of it.
    needsNewSession = false;
    retry.textContent = "Reconnect";
    chat.replaceChildren();
    trail.replaceChildren();
    bubble("note", "Starting a new session…");
    start();
    return;
  }

  bubble("note", "Reconnecting…");
  connect();
});

send.addEventListener("click", submit);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });

// Poll rather than rely on an ended event, because the reply may be spoken by
// the browser (speechSynthesis) or played as a file, and only one of those has
// a reliable one.
function waitForQuiet(then) {
  const started = performance.now();
  (function check() {
    if (!agentIsTalking() || performance.now() - started > 20000) {
      setTimeout(then, 250);   // a beat, so it does not feel like an interruption
      return;
    }
    setTimeout(check, 120);
  })();
}

mic.addEventListener("click", () => {
  if (listening) { stopDetector(); recognition.stop(); return; }
  startListening();
});

tts.addEventListener("change", () => {
  if (!tts.checked) stopSpeaking();
});

if (!canListen) {
  mic.title = "This browser has no speech recognition — Chrome, Edge or Safari do";
}

// getVoices() is empty until the list loads, so a first reply can arrive
// before any voice exists. Touching it here primes the list.
if (canSpeak) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

start();
</script>
</body>
</html>
